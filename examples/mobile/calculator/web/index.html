<!doctype html>
<!-- Author: 张晓达 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>JNative Mobile Calculator</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --ink: #1c1a16;
      --accent: #0b6e4f;
      --err: #9b2226;
      --card: #fffdf8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #d9efe6 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f7e2c8 0%, transparent 50%),
        var(--bg);
      min-height: 100dvh;
      padding: calc(1.25rem + var(--safe-top)) 1.25rem calc(1.25rem + var(--safe-bottom));
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .sub { opacity: 0.7; margin-bottom: 1.25rem; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; margin: 0.75rem 0 0.25rem; }
    input {
      width: 100%;
      font: inherit;
      font-size: 1.25rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid #cfc6b6;
      border-radius: 0.35rem;
      background: var(--card);
    }
    .ops {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-top: 0.85rem;
    }
    .ops button {
      margin-top: 0;
      font-size: 1.35rem;
      padding: 0.7rem 0;
      background: #2a4a3c;
    }
    .ops button.active {
      background: var(--accent);
      outline: 2px solid #063d2b;
    }
    button#go {
      margin-top: 1.1rem;
      width: 100%;
      font: inherit;
      font-size: 1.1rem;
      padding: 0.75rem;
      border: none;
      border-radius: 0.4rem;
      background: var(--accent);
      color: #f7fff9;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .result {
      margin-top: 1.25rem;
      font-size: 2rem;
      font-variant-numeric: tabular-nums;
    }
    .status { min-height: 1.25rem; margin-top: 0.5rem; }
    .status.error { color: var(--err); }
    .meta { margin-top: 1.5rem; font-size: 0.8rem; opacity: 0.65; }
    .note { margin-top: 0.75rem; font-size: 0.75rem; opacity: 0.55; max-width: 36rem; }
  </style>
</head>
<body>
  <h1>JNative Calculator</h1>
  <p class="sub">共享 WASM 核心 — 支持 + − × ÷（整数）</p>

  <label for="left">第一个整数</label>
  <input id="left" inputmode="numeric" autocomplete="off" placeholder="例如 123"/>

  <div class="ops" role="group" aria-label="运算符">
    <button type="button" data-op="0" class="active">+</button>
    <button type="button" data-op="1">−</button>
    <button type="button" data-op="2">×</button>
    <button type="button" data-op="3">÷</button>
  </div>

  <label for="right">第二个整数</label>
  <input id="right" inputmode="numeric" autocomplete="off" placeholder="例如 456"/>

  <label for="expr">或直接输入表达式</label>
  <input id="expr" autocomplete="off" placeholder="例如 123*456 或 12+30"/>

  <button id="go" type="button">计算</button>

  <div class="result">结果: <span id="result">—</span></div>
  <div id="status" class="status"></div>
  <div class="meta">
    <div id="platform">platform: …</div>
    <div id="lifecycle">lifecycle: …</div>
  </div>
  <p class="note">
    整数运算由 WASM 中的 CalculatorApp 完成；壳层不重复实现算术。
    也可在「表达式」框输入 123*456 一次算完。
  </p>

  <script type="module" src="./app-shell.js"></script>
</body>
</html>
