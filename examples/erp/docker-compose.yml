# Author: 张晓达
# PostgreSQL for JNative ERP (md5 — SCRAM not yet supported in RH-1).
services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: jnative_erp
      POSTGRES_PASSWORD: jnative_erp
      POSTGRES_DB: jnative_erp
    command:
      - postgres
      - -c
      - password_encryption=md5
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jnative_erp -d jnative_erp"]
      interval: 3s
      timeout: 3s
      retries: 20
