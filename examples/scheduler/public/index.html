<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JNative Scheduler</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <div class="shell">
      <header class="top">
        <div class="brand">JNative Scheduler</div>
        <input id="search" class="search" type="search" placeholder="Search events & tasks">
        <button id="btnToday" type="button">Today</button>
        <div id="userBox" class="user">Guest</div>
      </header>
      <div class="main">
        <aside class="side">
          <div id="miniCal" class="mini"></div>
          <h3>Calendars</h3>
          <div id="calList"></div>
          <h3>Tasks</h3>
          <div id="taskList"></div>
        </aside>
        <section class="content">
          <div class="toolbar">
            <button id="prev" type="button">‹</button>
            <button id="next" type="button">›</button>
            <h2 id="title">Calendar</h2>
            <div class="views">
              <button data-view="MONTH" type="button">Month</button>
              <button data-view="WEEK" type="button">Week</button>
              <button data-view="DAY" type="button">Day</button>
            </div>
            <button id="btnNew" class="primary" type="button">+ Event</button>
          </div>
          <div id="calendarView" class="calendar"></div>
          <div id="status" class="status">Loading…</div>
        </section>
      </div>
    </div>
    <div id="loginModal" class="modal">
      <form id="loginForm" class="card">
        <h2>Sign in</h2>
        <label>Email <input name="email" value="demo@jnative.dev" autocomplete="username"></label>
        <label>Password <input name="password" type="password" value="demo1234" autocomplete="current-password"></label>
        <button type="submit">Login</button>
        <p id="loginError" class="error"></p>
      </form>
    </div>
    <div id="editorModal" class="modal hidden">
      <form id="eventForm" class="card wide">
        <h2>Event</h2>
        <label>Title <input name="title" required></label>
        <label>Calendar
          <select name="calendarId" id="eventCal"></select>
        </label>
        <label>Start <input name="start" type="datetime-local" required></label>
        <label>End <input name="end" type="datetime-local" required></label>
        <label>Location <input name="location"></label>
        <label>Description <textarea name="description" rows="3"></textarea></label>
        <label>Reminder (minutes) <input name="minutesBefore" type="number" value="10"></label>
        <label>Repeat
          <select name="recurrenceRule">
            <option value="">None</option>
            <option value="DAILY">Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="MONTHLY">Monthly</option>
          </select>
        </label>
        <div class="row">
          <button type="submit">Save</button>
          <button type="button" id="btnCancel">Cancel</button>
          <button type="button" id="btnDelete" class="danger hidden">Delete</button>
        </div>
        <p id="editorError" class="error"></p>
      </form>
    </div>
    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
