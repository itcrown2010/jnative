<script>
(()=>{
const root=document.getElementById('wc-design'),screen=root.querySelector('#wc-screen'),nav=root.querySelector('#wc-nav'),caption=root.querySelector('#wc-caption'),announce=root.querySelector('#wc-announcement');
const saved=window.openai?.widgetState?.modelContent;
const state={role:['parent','teacher','ops','owner'].includes(saved?.role)?saved.role:'parent',page:'home',kid:'沐沐',date:16,attendance:Array(7).fill("出勤"),signed:false,published:false,leave:false,approved:false,feedback:'今天，沐沐提出让房子长出翅膀。她尝试了三种搭建方式，还主动邀请同伴一起完成屋顶。下次我们可以试试：这样的房子怎样降落呢？'};
const ic=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const btn=(label,action,secondary=false)=>`<button class="wc-btn ${secondary?'secondary':''}" data-go="${action}">${label}</button>`;
const head=(eyebrow,title,extra='')=>`<header class="wc-top"><div><p class="wc-eyebrow">${eyebrow}</p><h1>${title}</h1></div>${extra||`<button class="wc-iconbtn" data-go="messages" aria-label="查看消息">${ic('bell')}<span class="wc-dot"></span></button>`}</header>`;
const back=(title)=>`<button class="wc-back" data-go="home">${ic('chevron-left')}返回</button>${head('奇想校园',title)}`;
const section=(title,more,action)=>`<div class="wc-section-head"><h2>${title}</h2>${more?`<button class="wc-link" data-go="${action}">${more} →</button>`:''}</div>`;

const art=()=>`<div class="wc-art" role="img" aria-label="概念作品示意：三座不同形状的未来房屋"><span class="wc-house"></span><span class="wc-house"></span><span class="wc-house"></span></div>`;
const feedbackCard=()=>`<article class="wc-story"><div class="wc-author"><span class="wc-avatar">林</span><div>林老师 · 创意美术<div class="wc-sub">昨天 17:20 · 未来的房子</div></div></div>${art()}<h3 style="margin-top:13px">“我的房子可以飞去看大海。”</h3><p>${state.feedback.replace(/[<>&]/g,'')}</p><button class="wc-link" data-go="growth">走进${state.kid}的成长故事 →</button></article>`;

function home(){

function enroll(){return `${back('报名，一次讲清楚')}<label class="wc-field">学员<input class="wc-input" value="林沐沐"></label><label class="wc-field">课程与班级<select class="wc-input"><option>英语启蒙 · 小芽班</option><option>创意美术 · 星河班</option></select></label><label class="wc-field">收费方案<select class="wc-input"><option>英语40课时 · ¥4,800</option><option>美术秋季16课 · ¥2,880</option></select></label><div class="wc-inset"><div class="wc-listrow"><span>收款主体</span><span>云杉教育（示例）</span></div><div class="wc-listrow"><span>适用校区</span><span>云杉校区</span></div><div class="wc-listrow"><span>待确认</span><span>请假、补课及退款规则</span></div></div><button class="wc-btn full" data-action="contract">预览合同与权益规则</button><div class="wc-banner">正式版须确认合同快照后提交；本原型不生成合同或收款。</div>`}
function messages(){return `${head('通知与沟通','重要的事，不错过。')}<div class="wc-pills"><button class="wc-pill active" data-action="messages-all">全部</button><button class="wc-pill" data-action="messages-unread">未读</button></div>${[['calendar-clock','课程时间调整','英语启蒙调整至周六10:00，地点不变。','calendar'],['notebook-pen','林老师发布了课堂反馈','来看看“未来的房子”里，那些有趣的想法。','feedback'],['ticket','补课已安排','请确认10月24日的创意美术补课安排。','leave']].map(([i,a,b,g])=>`<div class="wc-listrow"><div class="wc-name"><span class="wc-avatar">${ic(i)}</span><div><h3>${a}</h3><p class="wc-sub">${b}</p><button class="wc-link" data-go="${g}">查看详情 →</button></div></div></div>`).join('')}<p class="wc-note">应用内通知示意，不代表已接通系统推送。</p>`}
function me(){return `${head('奇想校园','我的校园')}<div class="wc-inset"><div class="wc-name"><span class="wc-avatar">${state.role==='parent'?'林':'林'}</span><div><h3>${state.role==='parent'?'沐沐和予安的家长':state.role==='teacher'?'林老师':state.role==='ops'?'云杉校区 · 张教务':'六校区 · 负责人'}</h3><p class="wc-sub">当前身份：${{parent:'家长',teacher:'老师',ops:'教务',owner:'负责人'}[state.role]}</p></div></div></div>${[['user-round','身份与授权','roles'],['users','孩子与监护人','family'],['bell','通知设置','notification-settings'],['shield-check','隐私与作品授权','privacy'],['message-circle','帮助与问题反馈','help']].map(([i,t,g])=>`<div class="wc-listrow"><div class="wc-inline">${ic(i)}${t}</div><button class="wc-link" data-go="${g}" aria-label="打开${t}">查看 →</button></div>`).join('')}<div class="wc-banner">商业版中身份切换位于这里，且只显示账号实际拥有的身份。上方切换条仅用于设计评审。</div>`}
function campus(){return `${back('六校区，同一份用心')}${['云杉','星河','梧桐','青禾','晨光','湖畔'].map((n,i)=>`<div class="wc-listrow"><div><h3>${n}校区</h3><p class="wc-sub">${[168,156,149,143,131,115][i]}位在读学员 · 本月出勤${[95,94,96,93,94,92][i]}%</p></div><button class="wc-link" data-action="campus-${n}">进入 →</button></div>`).join('')}<div class="wc-banner">正式版按实际校区授权返回数据，不通过前端筛选实现隔离。</div>`}
const pages={home,calendar,lesson,roster,feedback,ledger,leave,growth,approvals,schedule,payments,students,enroll,messages,me,campus};
function render(){root.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===state.role)));screen.innerHTML=(pages[state.page]||home)();const items=state.role==='parent'?[['house','首页','home'],['calendar-days','课表','calendar'],['bell','消息','messages'],['user-round','我的','me']]:state.role==='teacher'?[['house','今天','home'],['calendar-days','课表','calendar'],['notebook-pen','反馈','feedback'],['user-round','我的','me']]:state.role==='ops'?[['house','工作台','home'],['calendar-days','课表','calendar'],['users','学员','students'],['user-round','我的','me']]:[['chart-no-axes-combined','概览','home'],['building-2','校区','campus'],['wallet','经营','payments'],['user-round','我的','me']];nav.innerHTML=items.map(([i,t,g])=>`<button data-go="${g}" ${state.page===g?'aria-current="page"':''}>${ic(i)}${t}</button>`).join('');caption.textContent=`${{parent:'家长端',teacher:'老师端',ops:'教务端',owner:'负责人'}[state.role]} · ${{home:'首页',calendar:'课表',lesson:'课程详情',roster:'签到',feedback:'课堂反馈',ledger:'课程权益',leave:'请假补课',growth:'成长档案',approvals:'教务待办',schedule:'排课',payments:'收款与课消',students:'学员',enroll:'报名',messages:'消息',me:'我的',campus:'校区'}[state.page]||'首页'}`;if(globalThis.lucide)lucide.createIcons();}
function toast(s){announce.textContent=s}
function persist(){window.openai?.setWidgetState?.({modelContent:{role:state.role,page:state.page},privateContent:null}).catch(()=>{})}
root.addEventListener('change',e=>{if(e.target.dataset.attendance!==undefined){state.attendance[Number(e.target.dataset.attendance)]=e.target.value;render()}});
root.addEventListener('input',e=>{if(e.target.id==='wc-feedback')state.feedback=e.target.value;if(e.target.id==='wc-student-search')screen.querySelectorAll('[data-student]').forEach(row=>row.hidden=!row.dataset.student.includes(e.target.value.trim()))});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.role){state.role=b.dataset.role;state.page='home';toast('');render();persist();return}if(b.dataset.date){state.date=Number(b.dataset.date);render();return}if(b.dataset.go){const go=b.dataset.go;if(go==='save-draft'){toast('草稿已保留在本地原型，家长不可见。');return}if(go==='preview-feedback'){screen.innerHTML=back('发布前，再看一眼')+feedbackCard()+`<div class="wc-banner">接收人：林沐沐的授权监护人。仅包含该孩子的反馈和作品。</div><button class="wc-btn full" data-action="publish">确认发布给家长</button>`;if(globalThis.lucide)lucide.createIcons();return}if(go==='return-leave'){toast('正式版需输入退回原因；此处仅预览流程。');return}if(!pages[go]){screen.innerHTML=back({roles:'身份与授权',family:'孩子与监护人',privacy:'隐私与作品授权','notification-settings':'通知设置',help:'帮助与反馈'}[go]||'设置')+`<div class="wc-inset"><h3>${go==='privacy'?'由你决定作品如何被看见':go==='family'?'关联孩子需要监护人验证':'清楚的权限，安心的使用'}</h3><p class="wc-sub">${go==='privacy'?'默认仅任课老师与授权监护人可见。班级展示、校区宣传分别征求授权，可查看并撤回。':go==='family'?'林沐沐、周予安 · 虚构示例。正式版通过安全邀请与校验关联，不允许搜索孩子姓名直接认领。':'本页为设计范围说明；账号、通知及帮助流程在完整设计规格中定义。'}</p></div>`;return}state.page=go;toast('');render();persist();return}const a=b.dataset.action;if(a==='kid'){state.kid=state.kid==='沐沐'?'予安':'沐沐';render();toast('已切换孩子；此为虚构资料预览。')}else if(a==='sign'){state.signed=true;render();toast('原型：已保存当前出勤选择；未执行真实扣课。')}else if(a==='publish'){state.published=true;state.page='feedback';render();toast('原型：反馈已发布，可切换家长端查看示意。')}else if(a==='leave'){state.leave=true;render();toast('原型：申请已提交；未发送真实通知。')}else if(a==='approve'){state.approved=true;render();toast('原型：已批准，补课资格待安排。')}else if(a==='schedule'){root.querySelector('#wc-conflict').hidden=false;toast('已展示冲突状态，未保存。')}else if(a==='all-present'){state.attendance.fill('出勤');render();toast('已将可签到学员设为出勤，请检查后确认。')}else if(a==='contract'){toast('合同预览需包含费用、权益、有效期、请假补课及退款规则；原型未生成实际合同。')}else if(a?.startsWith('campus-')){state.role='ops';state.page='home';render();toast(`原型进入${a.slice(7)}校区；首页展示云杉示例数据。`)}else if(a?.startsWith('growth-')){toast(a==='growth-all'?'显示全部成长记录。':'本原型展示精选记录；正式版按科目筛选。')}else if(a?.startsWith('messages-'))toast('消息筛选为设计示意，尚未连接真实数据。');persist()});
render();
if(globalThis.Tweak){const options={radius:24};const tweak=new Tweak({container:root.querySelector('.wc-device'),onChange:()=>{root.querySelectorAll('.wc-hero').forEach(x=>x.style.borderRadius=options.radius+'px')}});tweak.addSlider(options,'radius',{label:'课程主卡圆角',min:12,max:28,step:2,unit:'px'});}
})();
</script>
